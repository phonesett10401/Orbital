<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Orbital">
  <title>Orbital</title>
  <!--
    The mark is the app's own subject, drawn the way the app draws it.

    The ring is an orbit and the letter O at once, and the wrap is real: its
    minor radius (28) is smaller than the planet's (33), so the ellipse genuinely
    passes inside the disc at the top and bottom. The far arc is drawn before the
    globe and the near arc after it, so the globe occludes one and not the other.
    A first attempt used ry=36, which never crosses r=33 at all - the ring simply
    floated clear of the planet and the "wrap" was a clip cutting it in half.

    The day/night split is the terminator, which this project already renders on
    the real map. Its edge is an ellipse arc, never a straight line: a straight
    one makes a sphere read as a flat disc.
  -->
  <defs>
    <radialGradient id="day" cx="0.7" cy="0.32" r="0.9">
      <stop offset="0"    stop-color="#8ad6ff"/>
      <stop offset="0.45" stop-color="#2d7cc2"/>
      <stop offset="1"    stop-color="#12395f"/>
    </radialGradient>

    <!-- Night is not black. A planet with no sun on it still has sky over it. -->
    <radialGradient id="night" cx="0.3" cy="0.6" r="0.95">
      <stop offset="0" stop-color="#141d2e"/>
      <stop offset="1" stop-color="#070b12"/>
    </radialGradient>

    <!-- The orbit runs the app's own regime ramp: LEO blue into GEO gold. -->
    <linearGradient id="ring" x1="0" y1="0.15" x2="1" y2="0.85">
      <stop offset="0"    stop-color="#ffd06e"/>
      <stop offset="0.42" stop-color="#a9dcff"/>
      <stop offset="1"    stop-color="#5aa8ff"/>
    </linearGradient>

    <linearGradient id="rim" x1="0.05" y1="0.95" x2="0.95" y2="0.05">
      <stop offset="0"    stop-color="#78c8ff" stop-opacity="0.04"/>
      <stop offset="0.5"  stop-color="#9fd8ff" stop-opacity="0.4"/>
      <stop offset="1"    stop-color="#eaf6ff" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haze" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <clipPath id="globe"><circle cx="64" cy="64" r="33"/></clipPath>
    <!-- The near half, in the tilted frame the ring lives in. -->
    <clipPath id="near"><rect x="-10" y="64" width="148" height="74"/></clipPath>
  </defs>

  <!-- Atmosphere, kept faint: it is a halo, not a headline. -->
  <circle cx="64" cy="64" r="34" fill="#4a9fd8" opacity="0.16" filter="url(#haze)"/>

  <!-- The far arc, behind the planet. -->
  <g transform="rotate(-20 64 64)">
    <ellipse cx="64" cy="64" rx="47" ry="28" fill="none"
             stroke="url(#ring)" stroke-width="5.2" opacity="0.5"/>
  </g>

  <g transform="rotate(34 64 64)">
    <ellipse cx="64" cy="64" rx="43" ry="17" fill="none"
             stroke="#9fd8ff" stroke-width="1.5" opacity="0.22"/>
  </g>

  <circle cx="64" cy="64" r="33" fill="url(#day)"/>

  <g clip-path="url(#globe)">
    <!-- Land: abstract and few. Enough to read as a world, not as a wrong map. -->
    <g fill="#35946f" opacity="0.55">
      <path d="M78 42 q11 3 12 12 q1 8 -7 9 q-10 1 -12 -8 q-2 -9 7 -13 z"/>
      <path d="M68 74 q9 -2 12 5 q3 7 -4 11 q-9 4 -13 -3 q-3 -7 5 -13 z"/>
      <path d="M90 62 q6 1 6 6 q0 5 -6 5 q-6 -1 -6 -5 q0 -5 6 -6 z"/>
    </g>

    <path d="M64 31 A33 33 0 0 0 64 97 A11 33 0 0 1 64 31 Z" fill="url(#night)"/>

    <!-- Cities, dark side only, in the gold the key already uses for GEO. -->
    <g fill="#ffd58a">
      <circle cx="48" cy="50" r="1.1" opacity="0.95"/>
      <circle cx="41" cy="62" r="0.85" opacity="0.8"/>
      <circle cx="51" cy="73" r="1"    opacity="0.9"/>
      <circle cx="43" cy="80" r="0.75" opacity="0.65"/>
      <circle cx="55" cy="43" r="0.75" opacity="0.7"/>
      <circle cx="37" cy="70" r="0.65" opacity="0.55"/>
      <circle cx="46" cy="88" r="0.7"  opacity="0.6"/>
    </g>

    <!-- The lit haze along the terminator itself. -->
    <path d="M64 31 A11 33 0 0 0 64 97" fill="none"
          stroke="#ffc98a" stroke-width="1.4" opacity="0.45" filter="url(#haze)"/>
  </g>

  <circle cx="64" cy="64" r="33" fill="none" stroke="url(#rim)" stroke-width="1.8"/>

  <!-- The near arc, over the planet. This is the wrap. -->
  <g transform="rotate(-20 64 64)">
    <g clip-path="url(#near)">
      <ellipse cx="64" cy="64" rx="47" ry="28" fill="none"
               stroke="url(#ring)" stroke-width="5.2" filter="url(#glow)"/>
    </g>
    <!-- One satellite, on the near arc, where the eye lands last. -->
    <g transform="translate(31.5 85.3) rotate(-28)">
      <circle r="4" fill="#9fd8ff" opacity="0.35" filter="url(#haze)"/>
      <rect x="-1.6" y="-1.6" width="3.2" height="3.2" rx="0.5" fill="#f2f8ff"/>
      <rect x="-5"   y="-0.8" width="2.6" height="1.6" rx="0.35" fill="#78c8ff"/>
      <rect x="2.4"  y="-0.8" width="2.6" height="1.6" rx="0.35" fill="#78c8ff"/>
    </g>
  </g>
</svg>
