[project]
name = "orbital-backend"
version = "0.1.0"
description = "Data ingestion and API layers for Orbital, a live 3D globe tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio>=4.4",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# rootdir is backend/, so `app` imports resolve without installing the package.
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "anyio: async test, run under the asyncio backend (see conftest.py)",
]
filterwarnings = ["error::DeprecationWarning"]
