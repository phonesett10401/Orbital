[project]
name = "orbital-backend"
version = "0.1.0"
description = "Data ingestion and API layers for Orbital, a live 3D globe tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    # The global AIS feed is a WebSocket rather than an endpoint (D166).
    # **Declared explicitly although it was already installed**: it arrives as
    # a transitive dependency of uvicorn[standard], so importing it worked from
    # the first line written - and would have gone on working until somebody
    # installed uvicorn without the extra, at which point the ships layer
    # would fail to import for a reason nothing in this file explained.
    "websockets>=12",
    # 28,291 airports with ICAO codes and coordinates, so a departure can be
    # named from where a track begins (D78). Public-domain data, no network.
    "airportsdata>=20240000",
    # SGP4, the standard propagator for the orbital elements every satellite
    # source publishes (D93). Vallado's C++ reference with a Python wrapper,
    # and it ships the official verification data its own test suite checks
    # against -- which is what let the maths be proved before any of this was
    # wired up. No network.
    "sgp4>=2.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio>=4.4",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# rootdir is backend/, so `app` imports resolve without installing the package.
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "anyio: async test, run under the asyncio backend (see conftest.py)",
]
filterwarnings = ["error::DeprecationWarning"]
